# 공통 설정 — 모든 방식(M0~M3)에 동일하게 적용한다. (계획서 3장, PROJECT_PLAN 2장)
spring:
  application:
    name: stock-concurrency-lab
  datasource:
    # 로컬 실험용 설정. SSL을 끄는 것은 암호화 비용이 측정에 섞이지 않게 하기 위함이다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/stocklab?sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: lab
    password: lab
    # 커넥션 풀 크기 = Tomcat 최대 스레드 수(100). 요청을 처리하는 스레드가 DB 커넥션을 기다리지 않게 해서,
    # 측정값에 "커넥션 부족으로 인한 대기"가 섞이지 않도록 한다. (2주차, 지도교수 피드백 반영)
    # 기동 시 DbSettingsVerifier가 풀 크기 >= Tomcat 스레드 수인지 확인한다.
    hikari:
      maximum-pool-size: 100
      minimum-idle: 100
      connection-timeout: 5000
  jpa:
    open-in-view: false          # 재시도 시 이전 시도의 엔티티 재사용 방지
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always               # schema.sql (CREATE TABLE IF NOT EXISTS)
  profiles:
    # 방식 프로파일 → 엔티티 프로파일. 한 번의 실행에는 Product 엔티티 하나만 등록된다.
    group:
      m0: plain-entity
      m1: versioned-entity
      m2: versioned-entity
      m3: plain-entity

server:
  tomcat:
    threads:
      max: 100

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

lab:
  retry:
    max-retries: 0               # M2만 application-m2.yml에서 3
    delay-ms: 5
  purchase-log:
    enabled: false               # 정합성 실험(correctness 프로파일)에서만 true
  db:
    expected-isolation: REPEATABLE-READ
    expected-lock-wait-timeout: 3
    min-max-connections: 150     # 풀 100 + 관리·테스트용 여유. compose.yaml에서 200으로 설정
    # 커넥션 풀이 요청 처리 스레드 수보다 작으면 기동을 실패시킨다.
    # 풀 부족이 결과에 어떤 영향을 주는지 보여 주는 보조 실험에서만 false로 바꾼다.
    require-pool-covers-threads: true
