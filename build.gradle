plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.stocklab'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 기본 test: 구현 확인 테스트만 실행. 정합성 실험(@Tag("experiment"))은 2주차에 별도 태스크로 실행한다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'experiment'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// 실험 1(정합성): @Tag("experiment") 테스트만 실행한다. 결과는 results/correctness/correctness_<시각>.csv
// 실행: ./gradlew correctnessExperiment   (성능 실험 서버와 동시에 실행하지 않는다)
tasks.register('correctnessExperiment', Test) {
    description = '실험 1: 4 방식 × N{10,50,100} × 5회 정합성 검증 + 풀 64 보조 실험'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'experiment'
    }
    def stamp = new Date().format('yyyyMMdd_HHmmss')
    def gitVersion = ['git', 'describe', '--always', '--dirty'].execute(null, rootDir).text.trim()
    systemProperty 'lab.correctness.output', "${rootDir}/results/correctness/correctness_${stamp}.csv"
    systemProperty 'lab.code.version', gitVersion ?: 'unknown'
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

bootJar {
    archiveFileName = 'stock-concurrency-lab.jar'
}
